query queryBizUserEvents(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: BizEventQuery!
  $orderBy: BizOrder!
) {
  queryBizUserEvents(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        ...BizEventFields
        bizCompany {
          ...BizModelFields
        }
        bizUser {
          ...BizModelFields
        }
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

