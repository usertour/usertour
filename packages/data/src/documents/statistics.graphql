query queryContentAnalytics(
  $environmentId: String!
  $contentId: String!
  $startDate: String!
  $endDate: String!
  $timezone: String!
) {
  queryContentAnalytics(
    environmentId: $environmentId
    contentId: $contentId
    startDate: $startDate
    endDate: $endDate
    timezone: $timezone
  ) {
    uniqueViews
    totalViews
    uniqueCompletions
    totalCompletions
    viewsByDay
    viewsByStep
    viewsByTask
    viewsByBlock
  }
}

query queryBizSession(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: AnalyticsQuery!
  $orderBy: AnalyticsOrder!
) {
  queryBizSession(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        ...BizSessionFields
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

query queryContentQuestionAnalytics(
  $environmentId: String!
  $contentId: String!
  $startDate: String!
  $endDate: String!
  $timezone: String!
) {
  queryContentQuestionAnalytics(
    environmentId: $environmentId
    contentId: $contentId
    startDate: $startDate
    endDate: $endDate
    timezone: $timezone
  )
}

query listSessionsDetail(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: AnalyticsQuery!
  $orderBy: AnalyticsOrder!
) {
  listSessionsDetail(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        id
        createdAt
        progress
        data
        bizUserId
        state
        contentId
        version {
          sequence
        }
        bizUser {
          ...BizUserFields
        }
        bizEvent {
          ...BizEventFields
        }
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

query queryTooltipTargetMissingSessions(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: TooltipTargetMissingQuery!
  $orderBy: AnalyticsOrder!
) {
  queryTooltipTargetMissingSessions(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    sessions {
      totalCount
      edges {
        cursor
        node {
          id
          createdAt
          bizUserId
          bizUser {
            externalId
            data
          }
          bizEvent {
            id
            createdAt
            data
            event {
              codeName
            }
          }
        }
      }
      pageInfo {
        startCursor
        endCursor
        hasNextPage
        hasPreviousPage
      }
    }
    stepAnalytics {
      uniqueViews
      totalViews
      uniqueCompletions
      totalCompletions
      uniqueTooltipTargetMissingCount
      tooltipTargetMissingCount
    }
  }
}

