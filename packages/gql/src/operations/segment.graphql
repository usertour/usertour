fragment BizModelFields on BizModel {
  id
  createdAt
  externalId
  environmentId
  data
}

fragment BizUserFields on BizUser {
  id
  createdAt
  externalId
  environmentId
  data
  bizUsersOnCompany {
    id
    data
    bizCompany {
      ...BizModelFields
    }
  }
}

fragment BizEventFields on BizEvent {
  id
  createdAt
  eventId
  data
  bizUserId
  bizSessionId
  bizCompanyId
  event {
    id
    codeName
    displayName
    predefined
  }
}

fragment BizSessionFields on BizSession {
  id
  createdAt
  progress
  data
  bizUserId
  state
  contentId
  content {
    id
    name
    buildUrl
    environmentId
    editedVersionId
    publishedVersionId
    published
    deleted
    publishedAt
    createdAt
    updatedAt
    type
  }
  version {
    id
    sequence
    data
    steps {
      id
      name
      cvid
      type
      sequence
      data
    }
  }
  bizUser {
    ...BizUserFields
  }
  bizCompany {
    ...BizModelFields
  }
  bizEvent {
    ...BizEventFields
  }
}

mutation createSegment($data: CreatSegment!) {
  createSegment(data: $data) {
    id
  }
}

mutation updateSegment($data: UpdateSegment!) {
  updateSegment(data: $data) {
    id
  }
}

fragment SegmentFields on Segment {
  id
  bizType
  name
  environmentId
  dataType
  data
  columns
  createdAt
  source
  sourceId
}

query listSegment($environmentId: String!) {
  listSegment(environmentId: $environmentId) {
    ...SegmentFields
  }
}

mutation deleteSegment($id: ID!) {
  deleteSegment(data: { id: $id }) {
    success
  }
}

query queryBizUser(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: BizQuery!
  $orderBy: BizOrder!
) {
  queryBizUser(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        ...BizUserFields
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

query queryBizCompany(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: BizQuery!
  $orderBy: BizOrder!
) {
  queryBizCompany(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        ...BizModelFields
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

mutation createBizUserOnSegment($data: CreateBizUserOnSegment!) {
  createBizUserOnSegment(data: $data) {
    success
    count
  }
}

mutation deleteBizUserOnSegment($data: DeleteBizUserOnSegment!) {
  deleteBizUserOnSegment(data: $data) {
    success
    count
  }
}

mutation deleteBizUser($data: BizUserOrCompanyIdsInput!) {
  deleteBizUser(data: $data) {
    success
    count
  }
}

mutation deleteBizCompany($data: BizUserOrCompanyIdsInput!) {
  deleteBizCompany(data: $data) {
    success
    count
  }
}

mutation createBizCompanyOnSegment($data: CreateBizCompanyOnSegment!) {
  createBizCompanyOnSegment(data: $data) {
    success
    count
  }
}

mutation deleteBizCompanyOnSegment($data: DeleteBizCompanyOnSegment!) {
  deleteBizCompanyOnSegment(data: $data) {
    success
    count
  }
}

mutation deleteSession($sessionId: String!) {
  deleteSession(sessionId: $sessionId)
}

mutation endSession($sessionId: String!) {
  endSession(sessionId: $sessionId)
}

query querySessionDetail($sessionId: String!) {
  querySessionDetail(sessionId: $sessionId) {
    ...BizSessionFields
  }
}

query queryBizUserEvents(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: BizEventQuery!
  $orderBy: BizOrder!
) {
  queryBizUserEvents(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        ...BizEventFields
        bizCompany {
          ...BizModelFields
        }
        bizUser {
          ...BizModelFields
        }
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

query queryBizCompanyEvents(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: BizEventQuery!
  $orderBy: BizOrder!
) {
  queryBizCompanyEvents(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        ...BizEventFields
        bizCompany {
          ...BizModelFields
        }
        bizUser {
          ...BizModelFields
        }
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}
