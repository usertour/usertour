mutation deleteSession($sessionId: String!) {
  deleteSession(sessionId: $sessionId)
}

mutation endSession($sessionId: String!) {
  endSession(sessionId: $sessionId)
}

query querySessionDetail($sessionId: String!) {
  querySessionDetail(sessionId: $sessionId) {
    id
    state
    createdAt
    contentId
    data
    progress
    content {
      id
      name
      buildUrl
      environmentId
      editedVersionId
      publishedVersionId
      published
      deleted
      publishedAt
      createdAt
      updatedAt
      type
    }
    version {
      id
      sequence
      data
      steps {
        id
        name
        cvid
        type
        sequence
        data
      }
    }
    bizUser {
      id
      externalId
      environmentId
      data
      bizUsersOnCompany {
        id
        data
        bizCompany {
          id
          externalId
          data
        }
      }
    }
    bizEvent {
      id
      eventId
      createdAt
      data
      event {
        id
        codeName
        displayName
      }
    }
  }
}

