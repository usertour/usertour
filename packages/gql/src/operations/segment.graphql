    success
    count
  }
}

mutation deleteBizUser($data: BizUserOrCompanyIdsInput!) {
  deleteBizUser(data: $data) {
    success
    count
  }
}

mutation deleteBizCompany($data: BizUserOrCompanyIdsInput!) {
