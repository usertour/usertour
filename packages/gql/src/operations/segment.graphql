mutation createSegment($data: CreatSegment!) {
  createSegment(data: $data) {
    id
  }
}

mutation updateSegment($data: UpdateSegment!) {
  updateSegment(data: $data) {
    id
  }
}

query listSegment($environmentId: String!) {
  listSegment(environmentId: $environmentId) {
    id
    bizType
    name
    environmentId
    dataType
    data
    columns
    createdAt
    source
    sourceId
  }
}

mutation deleteSegment($id: ID!) {
  deleteSegment(data: { id: $id }) {
    success
  }
}

query queryBizUser(
  $first: Int
  $last: Int
  $after: String
  $before: String
  $query: BizQuery!
  $orderBy: BizOrder!
) {
  queryBizUser(
    first: $first
    last: $last
    after: $after
    before: $before
    query: $query
    orderBy: $orderBy
  ) {
    totalCount
    edges {
      cursor
      node {
        id
        createdAt
        externalId
        environmentId
        data
        bizUsersOnCompany {
          id
          data
          bizCompany {
            id
            externalId
            data
          }
        }
      }
    }
    pageInfo {
      startCursor
      endCursor
      hasNextPage
      hasPreviousPage
    }
  }
}

