# The scheme forwarded to the Nest server. When an edge proxy in front of this
# container (Railway, Cloudflare, an ALB) already terminated TLS, it hands us
# plain HTTP plus `X-Forwarded-Proto: https` — pass THAT through; overwriting
# it with $scheme (what this nginx itself saw: http) made the server derive
# http:// URLs in the OAuth metadata, and MCP clients refuse the mismatch
# against the https:// URL they connected to. Allow-list, not pass-through:
# a scheme has exactly two legal values, so anything else — including the
# header being absent (nginx is the outermost layer) — falls back to $scheme,
# and a client-crafted garbage value can never reach the server's URL
# derivation. Matched by LEFTMOST value, not exact string: duplicate headers
# get merged into "https, https" ($http_* joins with ", ", and nginx ≥1.23
# also combines them), and Express reads the leftmost — an exact match sent
# the merged value to $scheme (http), resurrecting the very bug this map
# fixes. (Spoofing `https` itself remains possible when nginx IS the edge;
# derived URLs only ever go back to the requester, so that is self-inflicted
# by design — see resolve-origin.ts.)
map $http_x_forwarded_proto $forwarded_proto {
    ~*^https\b https;
    ~*^http\b  http;
    default    $scheme;
}

# The Host forwarded to the Nest server. $host strips the port, so the default
# self-host (compose maps 8011:80, API_URL unset) derived http://localhost/...
# URLs — dead links, nothing listens on :80. Pass the client's own Host header
# ($http_host, port included). The "" arm only fires for an HTTP/1.0 client
# that sent no Host header at all; $host then falls back to server_name (here
# `_`) — not a real hostname, just non-empty, which is all we need from a
# client that effectively no longer exists.
map $http_host $forwarded_host {
    default $http_host;
    ""      $host;
}

server {
    listen ${NGINX_PORT};
    server_name _;

    server_tokens off;

    # Web UI entry files - do not cache so normal reloads can pick up new deployments
    location = /index.html {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location = /config.js {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "private, no-cache, no-store, max-age=0, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Web UI - default SPA routing fallback
    location / {
        root /usr/share/nginx/html/web;
        try_files $uri $uri/ /index.html;
    }

    # Web UI static assets - Vite content hashes, cache long-term
    location ^~ /assets {
        root /usr/share/nginx/html/web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Web UI static assets without content hashes, cache for 7 days
    location ~* ^/(avatars|images|favicon) {
        root /usr/share/nginx/html/web;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Specific SDK files with no-cache headers
    location = /sdk/es2020/usertour.js {
        alias /usr/share/nginx/html/sdk/es2020/usertour.js;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=0, must-revalidate";
        expires -1;
    }

    location = /sdk/legacy/usertour.iife.js {
        alias /usr/share/nginx/html/sdk/legacy/usertour.iife.js;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=0, must-revalidate";
        expires -1;
    }

    # SDK
    location /sdk/ {
        alias /usr/share/nginx/html/sdk/;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=31536000";
        expires 1y;
    }

    # API Routes. The `(/|$)` boundary keeps these prefixes from swallowing SPA
    # routes that merely start with the same letters — notably `/oauth-consent`
    # (the OAuth consent PAGE, served by the SPA), which `^/oauth` alone matched,
    # 404ing the consent step and killing the whole OAuth/MCP flow on self-host.
    # `api(-v2)?(-json)?` spells out the Swagger doc paths the server exposes
    # (/api, /api-json, /api-yaml, /api-v2, /api-v2-json, /api-v2-yaml) — the boundary alone would drop
    # the dashed ones back to the SPA. SPA routes like /apikeys still fall through.
    # CORS for these app endpoints is owned by the Nest app (enableCors in
    # configure-app.ts), including OPTIONS preflight — nginx only proxies here,
    # so preflight and the real response always agree (they come from one layer).
    location ~ ^/(graphql|api(-v2)?(-(json|yaml))?|stripe|v1|v2|oauth|inbound)(/|$) {
        # Match the app's 5mb body limit (main.ts useBodyParser) — nginx's 1m
        # default would 413 large cohort webhook pages before the app sees them.
        client_max_body_size 5m;
        proxy_pass http://localhost:${NEST_SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # OAuth discovery metadata (RFC 9728 / RFC 8414) — must reach the server,
    # not the SPA fallback. X-Forwarded-Proto so the issued metadata URLs use the
    # public scheme. CORS (browser MCP clients fetch this cross-origin) is set by
    # the Nest app.
    location ~ ^/\.well-known/oauth {
        proxy_pass http://localhost:${NEST_SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # MCP endpoint (Streamable HTTP; may stream via SSE) + its OAuth 401 challenge.
    # CORS + OPTIONS preflight + the WWW-Authenticate expose-header are set by the
    # Nest app (enableCors); nginx only carries the proxy/streaming concerns.
    location /mcp {
        proxy_pass http://localhost:${NEST_SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # WebSocket
    location /socket.io/ {
        proxy_pass http://localhost:${NEST_SERVER_PORT};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
} 
