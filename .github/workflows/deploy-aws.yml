name: Deploy to AWS

# Every push to main asks the private infrastructure repository to build
# and deploy it. The build and the deploy themselves live there, so this
# public repository carries no deploy logic and its logs show none. Inert
# until the repository variable AWS_DEPLOY_ENABLED is "true". The GitHub
# App whose id and key are referenced below is installed on the
# infrastructure repository only, with permission to run its workflows and
# nothing else.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger the deploy
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Mint a token for the infrastructure repository
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AWS_DEPLOY_DISPATCHER_CLIENT_ID }}
          private-key: ${{ secrets.AWS_DEPLOY_DISPATCHER_PRIVATE_KEY }}
          owner: usertour
          repositories: usertour-infra
          permission-actions: write

      # The deploy workflow builds the head of this repository's main; no
      # commit is passed, so this token can only ask for main to be deployed.
      - name: Run the deploy workflow
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh workflow run deploy.yml --repo usertour/usertour-infra --ref main
