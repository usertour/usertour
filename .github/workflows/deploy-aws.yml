name: Deploy to AWS

# Builds main with the same Dockerfile as the published image and rolls the
# two ECS services onto it. The workflow is inert until the repository
# variable AWS_DEPLOY_ENABLED is "true"; the role it assumes is the
# AWS_DEPLOY_ROLE_ARN secret. A manual dispatch redeploys the current main,
# which is also how a task-definition change registered by Terraform
# reaches the services.

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: usertour
  ECS_CLUSTER: usertour-prod

jobs:
  build:
    name: Build and push image
    if: ${{ vars.AWS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The tag alone crosses the job boundary: an output that contains the
      # masked account id would be dropped.
      - name: Name the build
        id: tag
        run: echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.tag.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:main
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify team on failure
        if: ${{ failure() }}
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.BUILD_NOTIFICATION_URL }}
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"msg_type": "text","text": {"content": "Usertour AWS image build failed"}}'

  deploy:
    name: Deploy ${{ matrix.service }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [api, web]

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Before the app stack exists there is nothing to deploy onto; the
      # pushed image is what that stack's first apply starts from.
      - name: Look for the service
        id: service
        run: |
          status=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "${ECS_CLUSTER}-${{ matrix.service }}" \
            --query 'services[0].status' --output text 2>/dev/null || echo MISSING)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ "$status" != "ACTIVE" ]; then
            echo "Service ${ECS_CLUSTER}-${{ matrix.service }} is not there yet; image pushed, nothing to deploy."
          fi

      # The family's latest revision carries whatever Terraform registered
      # last (environment, secrets, sizing); only the image changes here.
      - name: Fetch the current task definition
        if: ${{ steps.service.outputs.status == 'ACTIVE' }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "${ECS_CLUSTER}-${{ matrix.service }}" \
            --query taskDefinition > task-definition.json

      - name: Point it at the new image
        if: ${{ steps.service.outputs.status == 'ACTIVE' }}
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: app
          image: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.build.outputs.tag }}

      # The service's circuit breaker rolls a failing revision back on its
      # own; this step fails with it instead of reporting a green deploy.
      - name: Deploy
        if: ${{ steps.service.outputs.status == 'ACTIVE' }}
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_CLUSTER }}-${{ matrix.service }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Notify team on failure
        if: ${{ failure() }}
        uses: fjogeleit/http-request-action@v1
        with:
          url: ${{ secrets.BUILD_NOTIFICATION_URL }}
          method: 'POST'
          customHeaders: '{"Content-Type": "application/json"}'
          data: '{"msg_type": "text","text": {"content": "Usertour AWS deploy failed: ${{ matrix.service }}"}}'
