<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        padding: 12px 16px;
        color: #1f2937;
        background: #f9fafb;
      }
      h2 {
        margin: 0 0 8px;
        font-size: 14px;
        color: #6b7280;

  <body>

      id="lesson-activity"
      src="./test-iframe-activity.html?id=nested"
      title="Nested lesson activity"
    ></iframe>
