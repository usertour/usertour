<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson activity</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        margin: 0;
        padding: 16px 20px;
        color: #1f2937;
        background: #fff;
      }
      h2 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .name {
        color: #2563eb;
      }
      p {
        margin: 0 0 12px;
        color: #6b7280;
        font-size: 13px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      input {
        padding: 6px 10px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        width: 160px;
      }
      button {
        padding: 6px 14px;
        border: 1px solid #2563eb;
        border-radius: 4px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
      }
      button.hint-button {
        background: #fff;
        color: #2563eb;
      }
      a {
        font-size: 12px;
        color: #6b7280;
      }
    </style>
  </head>
  <body>
    <!--
      The content test-iframe.html embeds, once per frame. `?id=` names the
      copy: it lands on <body data-activity="…"> so a selector can tell the
      copies apart, e.g. [data-activity="nested"] #activity-submit.
    -->
    <h2>Lesson activity <span class="name" id="activity-name"></span></h2>
    <p>What is 6 × 7?</p>
    <div class="row">
      <input id="activity-answer" type="text" name="answer" placeholder="Your answer" />
      <button id="activity-submit" type="button">Submit answer</button>
      <button class="hint-button" type="button">Hint</button>
    </div>
    <a id="activity-reload" href="#">Reload this activity (the frame navigates)</a>

    <script>
      const activityId = new URLSearchParams(location.search).get('id') || 'unnamed';
      document.body.dataset.activity = activityId;
      document.getElementById('activity-name').textContent = `(${activityId})`;
      document.getElementById('activity-reload').addEventListener('click', (event) => {
        event.preventDefault();
        location.reload();
      });
    </script>
  </body>
</html>
